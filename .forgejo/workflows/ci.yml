name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MCP server
        run: zig build -Doptimize=ReleaseSafe

      - name: Verify binary
        run: |
          file zig-out/bin/vnc-mcp-server
          ls -la zig-out/bin/vnc-mcp-server
